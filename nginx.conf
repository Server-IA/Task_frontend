server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Dokploy/Traefik (HTTPS en el proxy) una redirección absoluta saldría como http://host:80/…
    absolute_redirect off;

    # Archivos con hash en el nombre: caché larga (un solo Cache-Control: expires agregaría otro)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html y la resuelve React Router. Sin $uri/: una ruta que coincide con
    # una carpeta de public/ (por ejemplo /email) no redirige a /email/ ni responde 403
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
